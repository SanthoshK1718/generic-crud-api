<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #111;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-app {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.08);
        }

        .name-screen {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .name-card {
            width: 100%;
            max-width: 360px;
        }

        .name-card h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .name-card p {
            margin: 0 0 20px;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.5;
        }

        .name-form {
            display: flex;
            gap: 10px;
        }

        .name-form input,
        .composer input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 15px;
            outline: none;
        }

        .name-form input:focus,
        .composer input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }

        .name-form button,
        .composer button,
        .copy-btn {
            border: none;
            border-radius: 10px;
            padding: 0 18px;
            background: #2563eb;
            color: #fff;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
        }

        .copy-btn {
            padding: 0 12px;
            min-width: 42px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .copy-btn.copied {
            background: #16a34a;
        }

        .header {
            padding: 14px 16px;
            border-bottom: 1px solid #e5e7eb;
            background: #fff;
        }

        .header h1 {
            margin: 0;
            font-size: 20px;
        }

        .members-label {
            margin: 12px 0 6px;
            font-size: 12px;
            font-weight: 600;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .members {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .member-chip {
            padding: 5px 10px;
            border-radius: 999px;
            background: #eef2f7;
            color: #374151;
            font-size: 12px;
            font-weight: 600;
        }

        .member-chip.self {
            background: #dbeafe;
            color: #1d4ed8;
        }

        .share-row {
            margin-top: 12px;
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .share-url {
            flex: 1;
            padding: 10px 12px;
            border-radius: 10px;
            background: #f3f4f6;
            font-size: 12px;
            line-height: 1.4;
            word-break: break-all;
            color: #374151;
            display: flex;
            align-items: center;
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .message.other {
            align-self: flex-start;
        }

        .message.self {
            align-self: flex-end;
        }

        .message-meta {
            font-size: 11px;
            color: #6b7280;
            padding: 0 4px;
        }

        .message.self .message-meta {
            text-align: right;
        }

        .message-bubble {
            padding: 12px 14px;
            border-radius: 16px;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.other .message-bubble {
            background: #eef2f7;
            color: #111;
            border-bottom-left-radius: 6px;
        }

        .message.self .message-bubble {
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .empty-state {
            margin: auto;
            text-align: center;
            color: #6b7280;
            font-size: 14px;
            line-height: 1.6;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px 16px 18px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .error-text {
            padding: 0 16px 12px;
            color: #b91c1c;
            font-size: 13px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <div id="nameScreen" class="name-screen">
            <div class="name-card">
                <h1>Chat</h1>
                <p>Enter your name to join the room. It will be saved on this device.</p>
                <form id="nameForm" class="name-form">
                    <input
                        id="nameInput"
                        type="text"
                        placeholder="Your name"
                        autocomplete="name"
                        maxlength="40"
                        required
                    />
                    <button type="submit">Enter</button>
                </form>
            </div>
        </div>

        <div id="chatScreen" class="hidden" style="display: flex; flex-direction: column; flex: 1; min-height: 0;">
            <div class="header">
                <h1>Chat</h1>
                <div class="members-label">Members</div>
                <div id="members" class="members"></div>
                <div class="share-row">
                    <div id="shareUrl" class="share-url"></div>
                    <button id="copyBtn" class="copy-btn" type="button" title="Copy room link" aria-label="Copy room link">⧉</button>
                </div>
            </div>

            <div id="messages" class="messages">
                <div class="empty-state" id="emptyState">No messages yet. Say hello.</div>
            </div>

            <div id="errorText" class="error-text hidden"></div>

            <form id="composerForm" class="composer">
                <input
                    id="messageInput"
                    type="text"
                    placeholder="Type a message..."
                    autocomplete="off"
                />
                <button id="sendButton" type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const roomId = params.get("roomId") || "global";
        const nameStorageKey = `chat-name:${roomId}`;
        const apiBase = window.location.origin;
        const roomUrl = `${apiBase}/session-chat?roomId=${encodeURIComponent(roomId)}`;

        if (params.has("sessionId")) {
            params.delete("sessionId");
            const cleanUrl = params.toString()
                ? `${window.location.pathname}?${params.toString()}`
                : window.location.pathname;
            window.history.replaceState({}, "", cleanUrl);
        }

        const nameScreen = document.getElementById("nameScreen");
        const chatScreen = document.getElementById("chatScreen");
        const nameForm = document.getElementById("nameForm");
        const nameInput = document.getElementById("nameInput");
        const membersEl = document.getElementById("members");
        const shareUrl = document.getElementById("shareUrl");
        const copyBtn = document.getElementById("copyBtn");
        const messagesEl = document.getElementById("messages");
        const emptyState = document.getElementById("emptyState");
        const composerForm = document.getElementById("composerForm");
        const messageInput = document.getElementById("messageInput");
        const errorText = document.getElementById("errorText");

        let sessionId = "";
        let socket = null;
        let lastMessageId = 0;
        const renderedMessageIds = new Set();
        const memberSet = new Set();
        const notificationsSupported = "Notification" in window;

        const requestNotificationPermission = async () => {
            if (!notificationsSupported || Notification.permission !== "default") {
                return;
            }
            await Notification.requestPermission();
        };

        const showBrowserNotification = (senderId, message) => {
            if (!notificationsSupported || Notification.permission !== "granted") {
                return;
            }

            if (!senderId || senderId === sessionId) {
                return;
            }

            if (document.hasFocus() && !document.hidden) {
                return;
            }

            const notification = new Notification(`${senderId} sent a message`, {
                body: message,
                tag: `chat-${roomId}`,
                renotify: true,
            });

            notification.onclick = () => {
                window.focus();
                notification.close();
            };
        };

        const showError = (message) => {
            errorText.textContent = message;
            errorText.classList.remove("hidden");
            setTimeout(() => errorText.classList.add("hidden"), 4000);
        };

        const formatTime = (timestamp) => {
            const date = new Date(timestamp);
            return date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
        };

        const renderMembers = (members = []) => {
            members.forEach((name) => memberSet.add(name));
            if (sessionId) {
                memberSet.add(sessionId);
            }

            membersEl.innerHTML = "";
            Array.from(memberSet)
                .sort((a, b) => a.localeCompare(b))
                .forEach((name) => {
                    const chip = document.createElement("span");
                    chip.className = `member-chip${name === sessionId ? " self" : ""}`;
                    chip.textContent = name === sessionId ? `${name} (you)` : name;
                    membersEl.appendChild(chip);
                });
        };

        const loadMembers = async () => {
            try {
                const response = await fetch(
                    `${apiBase}/ws/chat/members?roomId=${encodeURIComponent(roomId)}`
                );
                const body = await response.json();
                if (response.ok && body.success === 1) {
                    renderMembers(body.result?.data || []);
                }
            } catch {
                renderMembers();
            }
        };

        const appendMessage = ({ id, sessionId: senderId, message, timestamp }) => {
            const messageKey = id || `${senderId}-${timestamp}-${message}`;
            if (renderedMessageIds.has(messageKey)) {
                return;
            }
            renderedMessageIds.add(messageKey);

            if (senderId) {
                memberSet.add(senderId);
                renderMembers();
            }

            if (id && Number(id) > lastMessageId) {
                lastMessageId = Number(id);
            }

            if (emptyState && emptyState.parentElement) {
                emptyState.remove();
            }

            const isSelf = senderId === sessionId;
            const wrapper = document.createElement("div");
            wrapper.className = `message ${isSelf ? "self" : "other"}`;

            const meta = document.createElement("div");
            meta.className = "message-meta";
            meta.textContent = `${isSelf ? "You" : senderId} • ${formatTime(timestamp)}`;

            const bubble = document.createElement("div");
            bubble.className = "message-bubble";
            bubble.textContent = message;

            wrapper.appendChild(meta);
            wrapper.appendChild(bubble);
            messagesEl.appendChild(wrapper);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        const loadHistory = async () => {
            const query = new URLSearchParams({
                roomId,
                limit: "200",
            });

            const response = await fetch(`${apiBase}/ws/chat/messages?${query.toString()}`);
            const body = await response.json();

            if (!response.ok || body.success !== 1) {
                throw new Error(body.error || "Failed to load messages");
            }

            const messages = body.result?.data || [];
            messages.forEach((item) => appendMessage(item));

            if (!messages.length && !messagesEl.querySelector(".message")) {
                messagesEl.appendChild(emptyState);
            }

            return messages;
        };

        const connectWebSocket = () => {
            const wsProtocol = window.location.protocol === "https:" ? "wss:" : "ws:";
            const wsUrl = `${wsProtocol}//${window.location.host}/ws?sessionId=${encodeURIComponent(sessionId)}&roomId=${encodeURIComponent(roomId)}`;

            if (socket) {
                socket.close();
            }

            socket = new WebSocket(wsUrl);

            socket.onmessage = (event) => {
                let payload;
                try {
                    payload = JSON.parse(event.data);
                } catch {
                    return;
                }

                if (payload.type === "chat") {
                    appendMessage(payload);
                    showBrowserNotification(payload.sessionId, payload.message);
                }

                if (payload.type === "client_joined" && payload.sessionId) {
                    memberSet.add(payload.sessionId);
                    renderMembers();
                }
            };

            socket.onclose = () => {
                setTimeout(connectWebSocket, 2000);
            };
        };

        const initChat = async () => {
            shareUrl.textContent = roomUrl;

            try {
                await loadHistory();
                await loadMembers();
            } catch (error) {
                showError(`Could not load messages: ${error.message}`);
            }

            connectWebSocket();
        };

        const openChat = async (name) => {
            sessionId = name.trim();
            localStorage.setItem(nameStorageKey, sessionId);
            nameScreen.classList.add("hidden");
            chatScreen.classList.remove("hidden");
            shareUrl.textContent = roomUrl;
            renderMembers([sessionId]);
            await requestNotificationPermission();
            initChat();
        };

        nameForm.addEventListener("submit", (event) => {
            event.preventDefault();
            const name = nameInput.value.trim();
            if (!name) {
                return;
            }
            openChat(name);
        });

        copyBtn.addEventListener("click", async () => {
            try {
                await navigator.clipboard.writeText(roomUrl);
                copyBtn.textContent = "✓";
                copyBtn.classList.add("copied");
                setTimeout(() => {
                    copyBtn.textContent = "⧉";
                    copyBtn.classList.remove("copied");
                }, 1500);
            } catch {
                showError("Could not copy link");
            }
        });

        composerForm.addEventListener("submit", async (event) => {
            event.preventDefault();
            const message = messageInput.value.trim();
            if (!message) {
                return;
            }

            try {
                if (!socket || socket.readyState !== WebSocket.OPEN) {
                    throw new Error("WebSocket not connected");
                }

                socket.send(
                    JSON.stringify({
                        type: "chat",
                        sessionId,
                        roomId,
                        message,
                    })
                );
                messageInput.value = "";
            } catch (error) {
                showError(`Send failed: ${error.message}`);
            }
        });

        const savedName = localStorage.getItem(nameStorageKey);
        if (savedName) {
            openChat(savedName);
        } else {
            nameInput.focus();
        }
    </script>
</body>
</html>
