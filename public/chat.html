<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Chat</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: #f4f6f8;
            color: #111;
            height: 100vh;
            display: flex;
            justify-content: center;
        }

        .chat-app {
            width: 100%;
            max-width: 720px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: #fff;
            box-shadow: 0 0 24px rgba(0, 0, 0, 0.08);
        }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            max-width: 85%;
            padding: 12px 14px;
            border-radius: 16px;
            line-height: 1.45;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background: #2563eb;
            color: #fff;
            border-bottom-right-radius: 6px;
        }

        .message.ai {
            align-self: flex-start;
            background: #eef2f7;
            color: #111;
            border-bottom-left-radius: 6px;
        }

        .message.error {
            align-self: flex-start;
            background: #fee2e2;
            color: #991b1b;
        }

        .composer {
            display: flex;
            gap: 10px;
            padding: 14px 16px 18px;
            border-top: 1px solid #e5e7eb;
            background: #fff;
        }

        .composer input {
            flex: 1;
            border: 1px solid #d1d5db;
            border-radius: 999px;
            padding: 14px 18px;
            font-size: 16px;
            outline: none;
        }

        .composer input:focus {
            border-color: #2563eb;
        }

        .composer button {
            width: 48px;
            height: 48px;
            border: none;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .composer button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .composer button svg {
            width: 22px;
            height: 22px;
            fill: currentColor;
        }

        .empty {
            margin: auto;
            color: #6b7280;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="chat-app">
        <div class="messages" id="messages">
            <div class="empty">Type a message and press send</div>
        </div>

        <form class="composer" id="composer">
            <input
                id="messageInput"
                type="text"
                placeholder="Type your message..."
                autocomplete="off"
                required
            />
            <button type="submit" id="sendButton" aria-label="Send">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
                </svg>
            </button>
        </form>
    </div>

    <script>
        const messagesEl = document.getElementById("messages");
        const composerEl = document.getElementById("composer");
        const messageInputEl = document.getElementById("messageInput");
        const sendButtonEl = document.getElementById("sendButton");

        const addMessage = (text, type) => {
            const emptyState = messagesEl.querySelector(".empty");
            if (emptyState) {
                emptyState.remove();
            }

            const bubble = document.createElement("div");
            bubble.className = `message ${type}`;
            bubble.textContent = text;
            messagesEl.appendChild(bubble);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        };

        composerEl.addEventListener("submit", async (event) => {
            event.preventDefault();

            const message = messageInputEl.value.trim();
            if (!message) {
                return;
            }

            addMessage(message, "user");
            messageInputEl.value = "";
            sendButtonEl.disabled = true;

            try {
                const response = await fetch("/ai/reply", {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json",
                    },
                    body: JSON.stringify({ message }),
                });

                const data = await response.json();

                if (data.success === 1 && data.result?.data?.reply) {
                    addMessage(data.result.data.reply, "ai");
                } else {
                    addMessage(data.error || "Something went wrong", "error");
                }
            } catch (error) {
                addMessage("Failed to reach the server", "error");
            } finally {
                sendButtonEl.disabled = false;
                messageInputEl.focus();
            }
        });
    </script>
</body>
</html>
